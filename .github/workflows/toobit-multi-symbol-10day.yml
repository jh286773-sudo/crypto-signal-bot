name: AURUM X Selected-Symbol Available-History Walk-Forward

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: Shared historical window in days
        required: true
        default: "30"
        type: string
      symbols:
        description: Comma-separated selected Toobit symbols, e.g. BTC-SWAP-USDT,ETH-SWAP-USDT
        required: true
        type: string
      slippage_bps:
        description: Assumed adverse slippage per fill in bps (not measured)
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

jobs:
  multi-symbol-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Toobit multi-symbol historical backtest
        env:
          DAYS: ${{ github.event.inputs.days || '30' }}
          SYMBOLS: ${{ github.event.inputs.symbols || '' }}
          SLIPPAGE_BPS: ${{ github.event.inputs.slippage_bps || '1.0' }}
        run: |
          python run_toobit_multi_backtest.py \
            --days "$DAYS" \
            --symbols "$SYMBOLS" \
            --slippage-bps "$SLIPPAGE_BPS" \
            --output toobit_selected_available_history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurum-x-toobit-selected-available-history
          path: toobit_multi_crypto_30day.json
          if-no-files-found: warn
          retention-days: 30
