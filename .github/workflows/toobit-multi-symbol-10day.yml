name: AURUM X Selected-Symbol Full-History Walk-Forward

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: 0 = each timeframe's first available candle through today; otherwise cap lookback days
        required: true
        default: "0"
        type: string
      symbols:
        description: Selected Toobit USDT perpetuals (comma-separated)
        required: true
        default: "BTC-SWAP-USDT,ETH-SWAP-USDT,BNB-SWAP-USDT,SOL-SWAP-USDT,XRP-SWAP-USDT"
        type: string
      slippage_bps:
        description: Assumed adverse slippage per fill in bps (not measured)
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

jobs:
  multi-symbol-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Toobit multi-symbol historical backtest
        env:
          DAYS: ${{ github.event.inputs.days || '0' }}
          SYMBOLS: ${{ github.event.inputs.symbols || 'BTC-SWAP-USDT,ETH-SWAP-USDT,BNB-SWAP-USDT,SOL-SWAP-USDT,XRP-SWAP-USDT' }}
          SLIPPAGE_BPS: ${{ github.event.inputs.slippage_bps || '1.0' }}
        run: |
          python run_toobit_multi_backtest.py \
            --days "$DAYS" \
            --symbols "$SYMBOLS" \
            --slippage-bps "$SLIPPAGE_BPS" \
            --output toobit_selected_full_history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurum-x-toobit-selected-full-history
          path: toobit_selected_full_history.json
          if-no-files-found: warn
          retention-days: 30
