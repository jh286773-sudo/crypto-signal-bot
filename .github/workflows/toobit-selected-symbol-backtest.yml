name: AURUM X Selected-Symbol Backtest From 2026-11-09 01:00 UTC

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      start_datetime:
        description: Inclusive UTC start datetime (ISO-8601)
        required: true
        default: "2026-11-09T01:00:00Z"
        type: string
      symbols:
        description: Comma-separated Toobit USDT perpetual symbols
        required: true
        default: "BTC-SWAP-USDT,ETH-SWAP-USDT,BNB-SWAP-USDT,SOL-SWAP-USDT,XRP-SWAP-USDT"
        type: string

permissions:
  contents: read

jobs:
  selected-symbol-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate pagination and strategy tests
        run: |
          python -m unittest test_toobit_history_pagination.py
          python -m unittest discover -v
      - name: Run selected-symbol backtest from requested UTC datetime
        env:
          START_DATETIME: ${{ inputs.start_datetime || '2026-11-09T01:00:00Z' }}
          SYMBOLS: ${{ inputs.symbols || 'BTC-SWAP-USDT,ETH-SWAP-USDT,BNB-SWAP-USDT,SOL-SWAP-USDT,XRP-SWAP-USDT' }}
        run: |
          python run_toobit_multi_backtest.py --days 0 --start-datetime "$START_DATETIME" --symbols "$SYMBOLS" --slippage-bps 1.0 --adx-policy strict --output toobit_selected_strict.json
          python run_toobit_multi_backtest.py --days 0 --start-datetime "$START_DATETIME" --symbols "$SYMBOLS" --slippage-bps 1.0 --adx-policy balanced --output toobit_selected_balanced.json
          python run_toobit_multi_backtest.py --days 0 --start-datetime "$START_DATETIME" --symbols "$SYMBOLS" --slippage-bps 1.0 --adx-policy confirm_only --output toobit_selected_confirm_only.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurum-x-selected-backtest-from-2026-11-09-0100-utc
          path: toobit_selected_*.json
          if-no-files-found: warn
          retention-days: 30
