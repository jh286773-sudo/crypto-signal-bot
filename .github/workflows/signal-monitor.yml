name: Crypto Signal Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Restore persistent shadow-trading ledger
        uses: actions/cache@v4
        with:
          path: |
            aurum_shadow_trades.sqlite3
            aurum_shadow_trades.sqlite3-shm
            aurum_shadow_trades.sqlite3-wal
          key: aurum-shadow-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aurum-shadow-ledger-
      - name: Scan liquid USDT perpetual contracts
        env:
          MAX_SYMBOLS: "40"
          # Comma-separated user-selected intervals; unlisted intervals are not fetched or analyzed.
          SELECTED_TIMEFRAMES: "5m,15m,30m"
        run: python monitor.py
