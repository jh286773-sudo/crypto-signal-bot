name: Crypto Signal Bot

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - strategy-quality-upgrades
      - strategy-quality-upgrades-v2
      - smc-entry-risk-parity-v3
      - aurum-x/advanced-smc-entry-backtest
      - aurum-x-loss-reduction
      - aurum-x/expectancy-timestamp-parity-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python files
        run: python -m compileall -q .
      - name: Run strategy and backtest tests
        run: python -m unittest -v test_signal_engine.py test_expectancy.py test_backtest.py test_walk_forward.py test_engine_parity.py test_toobit_api_timestamps.py test_toobit_historical_backtest.py test_shadow_trading.py test_run_toobit_multi_backtest.py
